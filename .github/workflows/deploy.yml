name: Deploy What's New site

# Rebuilds and publishes whats-new-astro to GitHub Pages. The catalogue lives at
# the repo root and is copied into src/data by scripts/validate_catalogue.py, so
# any commit that touches the catalogue should already carry the synced copy.
on:
  push:
    branches: [main]
    paths:
      - 'whats-new-astro/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whats-new-astro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: whats-new-astro/package-lock.json

      - run: npm ci

      - name: Fail if the Astro copy of the catalogue is stale
        working-directory: .
        run: diff -q climate-assets.json whats-new-astro/src/data/climate-assets.json

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: whats-new-astro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
