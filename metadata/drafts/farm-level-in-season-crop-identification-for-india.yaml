title: Farm-Level, In-Season Crop Identification for India
description: Presents a deep-learning framework for farm-level, in-season, multi-crop identification at national
  scale in India, integrating Sentinel-1 and Sentinel-2 imagery with national farm boundary data. It samples
  points within field boundaries at 10 m resolution to avoid mixed-pixel contamination.
