id: alphaearth-foundations
title: 'AlphaEarth Foundations: An embedding field model for accurate and efficient global mapping from sparse
  label data'
description: Describes an embedding field model that compresses multi-source Earth observation data into 64-dimensional
  annual embeddings at 10 m resolution, enabling mapping and monitoring from sparse labels. An accompanying
  Satellite Embedding V1 dataset covering 2017-2024 is released.
resource_type: document
