cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: gdpcir-downscaled-projections-preserving-extremes
title: 'Global Downscaled Projections for Climate Impacts Research (GDPCIR): Preserving Extremes for Modeling
  Future Climate Impacts'
description: A global daily 0.25-degree bias-adjusted and downscaled climate projection product derived from
  CMIP6 models using quantile-preserving methods (QDM and QPLAD) to retain trends in temperature and precipitation
  extremes. Hosted on Microsoft Planetary Computer.
resource_type: dataset
keywords:
- bias-correction
- cmip
- cmip6
- downscaling
- era5
- global
- high-resolution
- precipitation
- stac
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-13'
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
