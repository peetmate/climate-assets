- rel: help
  url: https://planetarycomputer.microsoft.com/api/sas/v1/token/rhgeuwest/cil-gdpcir
- rel: describedby
  url: https://doi.org/10.5194/gmd-17-191-2024
note: Daily pr is precipitation in mm/day, tasmin and tasmax are daily minimum and maximum near-surface
  temperature in kelvin. Select model, scenario, member and calendar before decoding. The example v1.1
  store uses time, lat, lon at 0.25 degrees and a noleap calendar. Follow the item’s cmip6:license link
  for source-model terms. The compound licence describes the whole group. For an individual model,
  follow its collection licence and source-model citation requirements. The project requests citation of
  its methods paper, ERA5 and the source-model data used. Historical simulations span 1950–2014.
  Scenario simulations start in 2015 and end in 2099 or 2100 depending on model.
