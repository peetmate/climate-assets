note: 'Daily pr is precipitation in mm/day, tasmin and tasmax are daily minimum and maximum near-surface temperature
  in kelvin. Select model, scenario, member and calendar before decoding. The example v1.1 store uses time,
  lat, lon at 0.25 degrees and a noleap calendar. Follow the item’s cmip6:license link for source-model terms.
  The compound licence describes the whole group. For an individual model, follow its collection licence and
  source-model citation requirements. The project requests citation of its methods paper, ERA5 and the source-model
  data used. Historical simulations span 1950–2014. Scenario simulations start in 2015 and end in 2099 or 2100
  depending on model. Inventory audit checked 2026-11-17. Microsoft Planetary Computer provides chunked Zarr
  stores organised by model, scenario, member and variable. The group has CC BY, CC BY-SA and CC0 collections.
  Follow each item’s model-specific data licence. Fifteen CanESM5 stores appear in both CC BY and CC BY-SA
  collections, but both item records point to the same downscaled-data terms: CC BY 4.0, with credit to the
  original model and GDPCIR. The assessed release contains 247,997 Azure blobs. Stored download size is 23,118,984,118,093
  bytes. Current three Planetary Computer STAC collections. All 332 distinct Zarr store prefixes were queried
  with Azure List Blobs and an anonymously issued SAS. Summed Content-Length once per object, including chunks
  and metadata. The 116 items include duplicate references across licences. These are provider download volumes;
  converted storage requirements remain unknown. Licensing rights-holder identity is unknown. Actual Zarr reads
  need a short-lived SAS token issued anonymously at the linked token endpoint. An unsigned .zmetadata request
  returned HTTP 409 and the signed metadata and chunk requests succeeded. Cloud format, mixed model licences
  and this token requirement are recorded separately. A version for the entire group remains unknown; v1.1
  applies to the linked NESM3 variable store. The 332 distinct stores were deduplicated across 116 STAC items
  before counting blobs. Fifteen CanESM5 stores appear under two licence collections; both item records link
  to the same provider terms specifying CC BY 4.0 for the downscaled results, with credit to CanESM5 and GDPCIR.'
