cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: cra5-dataset-github
title: CRA5 Compressed ERA5 Dataset and Compression Models
description: Repository distributing the CRA5 dataset, an extreme (>300x) compression of the ERA5 reanalysis
  from 400+ TB to under 1 TB using a VAEformer variational transformer, together with pre-trained auto-encoder
  and forecasting models. Weather models trained on CRA5 match those trained on full ERA5.
resource_type: dataset
keywords:
- ai
- era5
- global
- machine-learning
- reanalysis
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-13'
