id: cra5-dataset-github
title: CRA5 Compressed ERA5 Dataset and Compression Models
description: CRA5 stores a lossy reconstruction of hourly global ERA5 fields on a 0.25-degree grid. Each binary
  bitstream encodes a complete 268-channel atmospheric state with 721 latitudes and 1,440 longitudes. It includes
  nine surface fields and seven variables on 37 pressure levels. The recorded Hugging Face revision is the snapshot
  identified by the dataset DOI.
