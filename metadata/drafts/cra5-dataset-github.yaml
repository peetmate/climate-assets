note: The DOI snapshot declares CDLA-Sharing-1.0. The data paper and the subsequent repository card declare CC BY
  4.0. The applicable reuse terms for the DOI snapshot require clarification. Decode an entire hour to obtain physical
  measurements. Compressed bytes, quantized latent values and normalized reconstructions have different meanings.
  The 268-channel checkpoint is 1,619,702,223 bytes and the reconstructed float32 field alone requires about 1.1
  GB, in addition to model and working memory.
data:
- name: first-hour
  description: Complete global state for 1979-01-01 00:00 UTC. Download and save as frame.bin. Use the pinned decoder
    with the 268-channel VAEformer checkpoint, installed from the linked source with its recommended Python 3.10
    environment. The decoder does not need ERA5 downloads. Its high-level constructor also creates a Climate Data
    Store client for encoding. For a decode-only invocation, suppress that unused downloader during construction
    using Python unittest.mock.patch("cra5.api.cra5_api.era5_downloader"). Instantiate api = cra5_api() from cra5.api
    in that context. Then set x = api.decode_from_bin(custom_path="frame.bin", return_format="de_normalized")["x_hat"].
    This applies each channel’s standard deviation and mean. Read x[api.vname_to_channels["t2m"], 360, 0] for reconstructed
    2 m air temperature in kelvin at 0° latitude, 0° longitude. Row i is 90 − 0.25i degrees north. Column j is 0.25j
    degrees east.
