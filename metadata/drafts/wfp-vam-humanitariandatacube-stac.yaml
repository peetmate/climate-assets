  url: https://api.earthobservation.vam.wfp.org/stac/collections/chirps_dekad
- rel: item
  title: WFP STAC item for 21–31 October 2026, including interval, grid and band metadata
  url: https://api.earthobservation.vam.wfp.org/stac/collections/chirps_dekad/items/chirps_dekad-202610d3
- rel: enclosure
  title: WFP GeoTIFF for the worked example (anonymous HTTPS download)
  url: https://data.source.coop/wfp/chirps-dekad/v3.0/2026/10/21/chirps-v3.0.2026.10.3.tif
- rel: describedby
