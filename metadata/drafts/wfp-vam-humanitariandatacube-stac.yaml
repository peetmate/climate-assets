id: wfp-vam-humanitariandatacube-stac
title: HumanitarianDataCube STAC
description: The World Food Programme's SpatioTemporal Asset Catalog (STAC) API provides public search and access
  to satellite and climate collections in its Humanitarian Data Cube. Each collection identifies its own providers
  and reuse terms.
resource_type: service
keywords:
- api
- food-security
- global
- real-time
- remote-sensing
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-17'
data:
- name: primary
  description: Follow the data link for collections or the search link for items and their asset URLs.
  locations:
  - url: https://api.earthobservation.vam.wfp.org/stac/
access: public
license: LicenseRef-WFP-Website-Terms
note: Worked collection example for chirps_dekad, the final CHIRPS v3 dekadal rainfall series. Fetch item chirps_dekad-202610d3
  for 21–31 October 2026, then read band 1 of the linked WFP GeoTIFF at longitude 36.82, latitude -1.28. With
  the file saved as rain.tif, run gdallocationinfo -wgs84 -valonly rain.tif 36.82 -1.28. The Float32 value 19.287365
  is accumulated rainfall in millimetres over that entire interval. Mask -9999 as missing. The item's unit field
  currently reads “1”. WFP documents dekadal totals, and the source's 2026 dekadal NetCDF declares precip:units
  = "mm/dekad". All 7200 × 2400 full-resolution band values match the UCSB GeoTIFF for this date. To reproduce
  that comparison, convert each TIFF with gdal_translate -of ENVI and compare the two Float32 binary data files.
  For this collection WFP lists CC-BY-4.0 and cites the CHIRPS v3 repository (10.15780/G2JQ0P). For material supplied
  by WFP, the default website terms permit personal, non-commercial copying with acknowledgement and restrict
  redistribution and derivative works. Special terms can override this default. Individual collections publish
  their own terms. The catalogue root identifies WFP and the service title. STAC 1.0.0 identifies the metadata
  standard. The OpenAPI description identifies FastAPI 0.1.0 and supplies no catalogue publication date or release.
  WFP's preferred service citation and any special catalogue-metadata terms remain unconfirmed. Inventory review
  checked 2026-11-17. Formats vary by collection. Verified COG pixel reads for final CHIRPS v3 Daily SAT, Daily
  RNL and Dekad. The three verified CHIRPS v3 collections specify CC BY 4.0. Credit the source, link the licence
  and identify changes. Other WFP collections have their own terms. Final CHIRPS v3 Daily SAT, Daily RNL and Dekad
  allow anonymous selective reads. Check the selected route for other collections. Complete stored byte total
  and physical file count are unknown. The provider lists 168 collections. The whole catalogue requires collection-specific
  review. The three final CHIRPS v3 distributions qualify for direct federation with attribution. Service release
  identifier, preferred service citation and special catalogue-metadata terms remain unknown. The final daily
  SAT variant returned 0.23286 mm at 76.30 degrees W, 3.53 degrees N on 15 September 2026 using band 1 and anonymous
  range reads. The final daily RNL variant returned 1.79931 mm at 76.30 degrees W, 3.53 degrees N on 15 September
  2026 using band 1 and anonymous range reads.
