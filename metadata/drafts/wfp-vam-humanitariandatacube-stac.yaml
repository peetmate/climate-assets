# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: wfp-vam-humanitariandatacube-stac
title: HumanitarianDataCube STAC
description: The World Food Programme's SpatioTemporal Asset Catalog (STAC) API provides public search
  and access to satellite and climate collections in its Humanitarian Data Cube. Each collection
  identifies its own providers and reuse terms.
resource_type: service
keywords:
- api
- food-security
- global
- real-time
- remote-sensing
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-16'
data:
- name: primary
  description: Follow the data link for collections or the search link for items and their asset URLs.
  locations:
  - url: https://api.earthobservation.vam.wfp.org/stac/
access: public
note: >-
  Worked collection example for chirps_dekad, the final CHIRPS v3 dekadal rainfall series. Fetch item
  chirps_dekad-202610d3 for 21–31 October 2026, then read band 1 of the linked WFP GeoTIFF at
  longitude 36.82, latitude -1.28. With the file saved as rain.tif, run
  gdallocationinfo -wgs84 -valonly rain.tif 36.82 -1.28. The Float32 value 19.287365 is accumulated
  rainfall in millimetres over that entire interval. Mask -9999 as missing. The item's unit field
  currently reads “1”. WFP documents dekadal totals, and the source's 2026 dekadal NetCDF declares
  precip:units = "mm/dekad". All 7200 × 2400 full-resolution band values match the UCSB GeoTIFF
  for this date. To reproduce that comparison, convert each TIFF with gdal_translate -of ENVI and
  compare the two Float32 binary data files. For this collection WFP lists CC-BY-4.0 and cites
  the CHIRPS v3 repository (10.15780/G2JQ0P). Catalogue-wide terms and preferred service citation
  still require WFP confirmation.
additional_links:
