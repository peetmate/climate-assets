id: agmrv-knowledge-portal
title: AgMRV Knowledge Portal
description: A gateway to guidance, methodologies, case studies, databases and software for the measurement,
  reporting and verification (MRV) of greenhouse gas emissions and mitigation in agriculture. It covers livestock,
  rice and agroforestry, with sections on MRV in Practice, a Resource Library, and Software & Tools.
resource_type: service
