license: CC-BY-4.0
note: 'Updated 2026-11-19 against arXiv v2 (9 November 2026): AlphaEarth input confirmed. Authors report 51%
  improvement in spatial-holdout NDCG ranking over coordinate-only models. Predictions describe relative occurrence,
  not absolute occupancy; spatial extrapolation is not future-climate forecasting. The paper describes a static
  model and plans to release weights; no verified OCELOT code, weight or prediction-download route found in
  this review. CC BY 4.0 covers the paper; software, weights and derived-data terms remain unconfirmed. Potential
  inventory relevance: biodiversity-monitoring methods; operational availability unconfirmed. First submitted
  2026-10-30; current paper revision 2026-11-09. Published author contact: Bart van Merriënboer,
  Google DeepMind, bartvm@google.com. Licensing-party identity remains unconfirmed; author affiliation alone
  does not establish it.'
