id: ocelot-planetary-scale-species-distribution-modeling
title: 'OCELOT: Planetary-Scale Species Distribution Modeling with Satellite Foundation Embeddings'
description: Preprint on scaling relative-occurrence species distribution models to 2 billion GBIF records
  across 100,000 taxa, using a multimodal implicit neural representation network that fuses spatial coordinates
  with satellite foundation embeddings. Spatiotemporal thinning and sub-linear cell sampling correct for observer
  bias and spatial redundancy, while an additive taxonomic readout shares representations across species, genus
  and family to improve predictions for rare taxa.
resource_type: document
