id: ocelot-planetary-scale-species-distribution-modeling
title: 'OCELOT: Planetary-Scale Species Distribution Modeling with Satellite Foundation Embeddings'
description: Preprint describing OCELOT, a relative-occurrence species model combining geographic coordinates
  and AlphaEarth Foundations satellite embeddings, trained using about 2 billion GBIF observations across 100,000
  taxa. Spatial holdout tests assess transfer to poorly sampled regions for camera-trap and acoustic species
  identification.
resource_type: document
