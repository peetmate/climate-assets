cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: global-pasture-watch
title: Global Pasture Watch
description: A research consortium led by Land & Carbon Lab producing recurrent global maps of grassland class
  and extent, vegetation height, gross primary productivity and livestock headcount from 2000 onwards, built
  with spatiotemporal machine learning on Earth observation data. Six v1 products are published in the Google
  Earth Engine catalogue — annual dominant grassland class, cultivated and natural/semi-natural grassland probabilities,
  short vegetation height and uncalibrated GPP at 30 m, plus FAOSTAT-adjusted livestock headcount at 1 km.
resource_type: service
keywords:
- earth-engine
- faostat
- global
- grasslands
- land-cover
- livestock
- machine-learning
- remote-sensing
cdh:
  domain:
  - land
  - agricultural-production
created: '2026-11-13'
updated: '2026-11-13'
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
