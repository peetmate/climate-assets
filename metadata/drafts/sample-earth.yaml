# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: sample-earth
title: Sample Earth
description: An open, machine-learning-ready global land-cover reference dataset of GPS-located, quality-controlled
  sample points to train and validate AI land-cover maps, with a focus on coffee and cocoa smallholder production
  systems. Uses 10 main classes and 68 sub-classes, combining expert interpretation of high-resolution imagery
  with ground-truth observations.
resource_type: dataset
keywords:
- cocoa
- coffee
- land-cover
- machine-learning
- remote-sensing
cdh:
  domain:
  - agricultural-production
  - land
created: '2026-11-13'
updated: '2026-11-13'
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
