id: forestcast-forecasting-deforestation-risk-at-scale-with-deep-learning
title: 'ForestCast: Forecasting Deforestation Risk at Scale with Deep Learning'
description: A preprint introducing the ForestCast dataset, the first publicly available dataset for training
  deep learning models to forecast deforestation risk. It benchmarks several deep learning models against a
  Random Forest baseline and evaluates the relative importance of satellite imagery, derived feature layers
  and past-deforestation change history.
