id: global-nature-watch
title: Global Nature Watch
description: An open, AI-powered platform with a chat-style interface that integrates 80+ peer-reviewed datasets
  from Global Forest Watch and Land & Carbon Lab. Users ask plain-language questions to explore change across
  forests, grasslands, wetlands, croplands, pastures and carbon fluxes via maps and statistics.
