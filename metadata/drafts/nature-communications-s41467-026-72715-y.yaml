id: nature-communications-s41467-026-72715-y
title: Addressing global hotspots of drought-related crop production losses
description: Combines gridded climate data, agricultural statistics and water-production functions to map crop-specific
  drought sensitivity for 17 major crops (75% of global production), estimating ~10.1% rainfed and 6.8% irrigated
  median production losses under historic extremes and pinpointing hotspots (central US, eastern Brazil, Mediterranean,
  South Asia). Shows targeted irrigation expansion and crop switching could avoid 62% of rainfed losses.
