title: Copernicus Climate's ERA6 reanalysis production starts
description: Announcement that production of ERA6, the next-generation C3S/ECMWF climate reanalysis, has begun,
  with a phased rollout from late 2027 offering more than twice the horizontal resolution of ERA5, a coupled
  ocean-atmosphere-wave model and over 75 years of hourly data.
