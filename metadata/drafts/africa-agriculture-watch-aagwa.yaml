id: africa-agriculture-watch-aagwa
title: Africa Agriculture Watch (AAgWa)
description: A web-based platform combining remote sensing data and machine learning to support decision-making
  in African food production systems, producing crop production forecasts and using crop evapotranspiration
  as a proxy for water stress.
