id: harmonised-dataset-for-earth-system-foundation-models
title: A harmonised dataset for Earth system foundation models (WorldTensor)
description: A preprint presenting WorldTensor, a harmonised global dataset aligning hundreds of environmental
  and socioeconomic variables to a standardised 0.25 degree grid and annual temporal framework. It integrates
  reanalysis, remote sensing, emissions inventories, land use, hydrology, infrastructure, hazard and socioeconomic
  data to support multimodal Earth system foundation models.
resource_type: document
