note: 'Local inventory review on 17 November 2026. The v1 release lists a CSV table and a ZIP distribution.
  The tabular observations can be converted to Parquet. The deposited data are CC BY-SA 4.0. Give credit, link
  the licence, indicate changes and share adaptations under the same licence. A reader retrieved data from
  the reviewed distribution without credentials, a form or paid access.


  Download inventory checked on 2026-11-17. 11,965,749,587 bytes; 2 files. Published deposit, including any
  documentation and archives. Archive members are not counted separately.


  The release-level licensing rights holder or administrator is unknown. Published creators and contact authors
  have their documented roles only.


  Start with Helmets_Kenya_v1.csv. latitude and longitude locate each crop-label point, crop_type gives its
  category, and capture_time identifies the timestamp. The year column groups observations by year. image_path
  identifies its image inside KENYA_v2.zip. The Google Cloud image_url is an alternative route whose access
  can differ from the public ZIP.'
