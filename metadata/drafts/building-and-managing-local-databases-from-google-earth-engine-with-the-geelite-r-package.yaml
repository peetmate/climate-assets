title: Building and Managing Local Databases from Google Earth Engine with the geeLite R Package
description: World Bank Policy Research Working Paper 11115 describing geeLite, an R package that builds, manages
  and incrementally updates local SQLite databases of zonal statistics extracted from Google Earth Engine.
  It delegates heavy computation to the GEE cloud while handling aggregation and reproducible storage locally.
