  title: GLOPOP-S
  authors:
  - given: Marijn
    family: Ton
  date: '2023'
  publisher: Harvard Dataverse
  url: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/KJC3RH&version=4.5
note: Version 4.5 is the November 2024 release of the 2015 population. Cite the dataset and the accompanying
  Scientific Data article. The DOI landing page also lists later releases with different reference years. Use
  the versioned file inventory below for additional regions. Inventory audit checked 2026-11-17. GLOPOP-S v4.5
  uses gzip-compressed regional binary files. Decode the 15 fields with the provider reader before writing
  Parquet. CC BY 4.0 allows sharing and adaptation. Credit the creators, link the licence and identify changes.
  The assessed release contains 1,746 files. Stored download size is 5,140,304,381 bytes. Published deposit,
  including any documentation and archives. Archive members are not counted separately. These are provider
  download volumes; converted storage requirements remain unknown. Licensing rights-holder identity is unknown.
  Anonymous download of the 1,633-byte Albania regional sample was verified. The archive-wide inventory includes
  1,746 deposited files; the individual sample size recorded under data applies only to that regional file.
data:
- name: albania-region-albr208
  description: Unrestricted gzip-compressed regional file synthpop_ALBr208.dat.gz for Albania, Global Data
    Lab region ALBr208, 2015. Decompress, read little-endian int32 values and reshape to (15, number_of_people),
    then transpose so each row represents one synthetic person. The linked Python reader gives column names
    and codes. For example the fifth column RURAL uses 1 for rural and 0 for urban. HID is unique only within
    the region.
  media_type: application/gzip
  file_size: 1633
