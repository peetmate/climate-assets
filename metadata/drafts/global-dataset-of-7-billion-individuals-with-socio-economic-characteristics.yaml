id: global-dataset-of-7-billion-individuals-with-socio-economic-characteristics
title: A global dataset of 7 billion individuals with socio-economic characteristics
description: GLOPOP-S represents 7,335,881,094 synthetic individuals in 1,999,227,130 households in 2015. Files
  are grouped by country and Global Data Lab subnational region. Synthesised attributes describe the modelled
  population and do not identify surveyed people.
resource_type: dataset
keywords:
- global
- high-resolution
- poverty
