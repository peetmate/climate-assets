id: agwise-data-sourcing
title: agwise-data — AgWise data-sourcing module
description: Python and R module that fetches, harmonises and caches analysis-ready climate, soil, terrain
  and remote-sensing inputs for a region and period from one call, returning data cubes, point tables or crop-model
  input files. Variables arrive under agreed names and units (PRCP in mm/day, CLAY in %), downloaded once into
  a shared cache and reused, with writers that emit DSSAT and APSIM inputs directly.
resource_type: software
