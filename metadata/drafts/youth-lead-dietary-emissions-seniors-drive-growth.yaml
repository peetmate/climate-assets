id: youth-lead-dietary-emissions-seniors-drive-growth
title: Youth lead current dietary emissions while seniors increasingly drive total emission growth
description: Analysis of dietary greenhouse-gas emissions across 22 age groups and 141 food products in 149
  countries (2000-2019), combining the Global Dietary Database with FAOSTAT-based emission inventories. Adolescents
  and young adults have the highest per-capita dietary emissions, while population ageing (especially in higher-income
  countries) drives total emission growth; rising meat intake is the dominant driver and often coincides with
  declining nutritional quality.
