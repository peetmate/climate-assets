# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: forest-data-partnership-commodity-models
title: Forest Data Partnership commodity probability models (Earth Engine)
description: Forest Data Partnership commodity model outputs for cocoa, coffee, palm and rubber at 10
  m in the pantropics, for 2018, 2020, 2022 and 2024. Forest Persistence v0 is a separate 30 m score for
  undisturbed forest in 2020.
resource_type: dataset
keywords:
- deforestation
- forests
- cocoa
- coffee
- oil-palm
- rubber
- eudr
- commodities
- crop-mapping
- earth-engine
- remote-sensing
- high-resolution
- global
cdh:
  domain:
  - land
  - agricultural-production
created: '2026-11-13'
updated: '2026-11-16'
contact:
- organization: Google for the Forest Data Partnership
  url: https://developers.google.com/earth-engine/datasets/publisher/forestdatapartnership
  roles:
  - producer
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
version: 2026a
license: CC-BY-4.0
access: restricted
access_note: Earth Engine requires a registered project and authentication. The alternative Google Cloud
  Storage commodity COG archive uses Requester Pays and requires an authenticated billing project. The
  index and access guide identify tiles by commodity, year and southwest corner.
data:
- name: cocoa
  locations:
  - url: https://developers.google.com/earth-engine/datasets/catalog/projects_forestdatapartnership_assets_cocoa_model_2026a
  description: Earth Engine collection projects/forestdatapartnership/assets/cocoa/model_2026a. Select
    year and band probability (0–1).
- name: coffee
  locations:
  - url: https://developers.google.com/earth-engine/datasets/catalog/projects_forestdatapartnership_assets_coffee_model_2026a
  description: Earth Engine collection projects/forestdatapartnership/assets/coffee/model_2026a. Select
    year and band probability (0–1).
- name: palm
  locations:
  - url: https://developers.google.com/earth-engine/datasets/catalog/projects_forestdatapartnership_assets_palm_model_2026a
  description: Earth Engine collection projects/forestdatapartnership/assets/palm/model_2026a. Select
    year and band probability (0–1).
- name: rubber
  locations:
  - url: https://developers.google.com/earth-engine/datasets/catalog/projects_forestdatapartnership_assets_rubber_model_2026a
  description: Earth Engine collection projects/forestdatapartnership/assets/rubber/model_2026a. Select
    year and band probability (0–1).
- name: forest-persistence
  locations:
  - url: https://developers.google.com/earth-engine/datasets/catalog/projects_forestdatapartnership_assets_community_forests_ForestPersistence_2020
  description: Earth Engine image projects/forestdatapartnership/assets/community_forests/ForestPersistence_2020.
    Band value (0–1) measures support for undisturbed forest in 2020.
- name: commodity-tile-index
  locations:
  - url: https://storage.googleapis.com/earth-engine-public-requester-pays/forestdatapartnership/2026a/fdap_index.csv
additional_links:
- rel: related
  url: https://developers.google.com/earth-engine/datasets/publisher/forestdatapartnership
- rel: help
  url: https://developers.google.com/earth-engine/guides/forest_data_partnership_gcs_readme
- rel: help
  url: https://console.cloud.google.com/earth-engine
- rel: describedby
  url: https://github.com/google/forest-data-partnership/blob/main/models/model_2026a/README.md
attribution: Produced by Google for the Forest Data Partnership. For Forest Persistence v0, also acknowledge
  modified Copernicus Sentinel data as specified on the layer page.
citation:
  title: Community models 2026a
  authors:
  - organization: Forest Data Partnership
  date: '2026'
  url: https://developers.google.com/earth-engine/datasets/publisher/forestdatapartnership
note: The 2026a citation applies to the commodity models. The v0 persistence layer separately requests
  citation of Forest Data Partnership. Check the layer-specific mask and model limitations before interpreting
  a score.
