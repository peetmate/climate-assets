cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: forest-data-partnership-commodity-models
title: Forest Data Partnership commodity probability models (Earth Engine)
description: 'Earth Engine collection of five open layers for commodity-driven deforestation monitoring: annual
  10 m per-pixel probability of cocoa, coffee, oil palm and rubber (2026a release, 2018-2024), plus a 30 m
  Forest Persistence v0 score for 2020 indicating whether a pixel was undisturbed forest, built by a convergence-of-evidence
  approach. Produced by Google for the Forest Data Partnership, a WRI-hosted initiative uniting public and
  private partners around open geospatial data on forest-risk commodities.'
resource_type: dataset
keywords:
- deforestation
- forests
- cocoa
- coffee
- oil-palm
- rubber
- eudr
- commodities
- crop-mapping
- earth-engine
- remote-sensing
- high-resolution
- global
