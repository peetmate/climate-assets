id: global-1km-gridded-household-consumption-ppp
title: A global 1 km gridded dataset of household consumption expenditure in purchasing power parity 2013-2024
description: A global 1 km gridded dataset of household and NPISH final consumption expenditure in purchasing-power-parity
  (constant 2021 international dollars), 2013-2024. Disaggregates World Bank economy-level totals using nighttime
  lights, population, built-up surface, roads and POIs in a stacked Super Learner framework; released as observed-only
  and regionally completed variants with per-capita, cell-total and QA rasters. Aimed at welfare geography,
  market access and SDG analyses (poverty, equity).
resource_type: dataset
