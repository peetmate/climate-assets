note: 'Local inventory review on 17 November 2026. The 2013 consumption TIFF has tiles and no overviews. Prepare
  a COG with overviews for multi-scale access. CC BY 4.0 allows sharing and adaptation. Credit the creators,
  link the licence and identify changes. A reader retrieved data from the reviewed distribution without credentials,
  a form or paid access.


  Download inventory checked on 2026-11-17. 4,208,993,451 bytes; 73 files. Published deposit, including any
  documentation and archives. Archive members are not counted separately.


  The release-level licensing rights holder or administrator is unknown. Published creators and contact authors
  have their documented roles only.


  For interpretation, use country_year_metadata_release.csv alongside the matching year’s raster. consumption_ppp_cell_YYYY
  gives cell-total expenditure in constant 2021 international dollars, PPP; consumption_ppp_percap_YYYY gives
  per-capita expenditure. The fillpop variants apply the release’s regional completion. Read each GeoTIFF’s
  CRS and NoData value before querying coordinates; the tested 2013 cell-total raster uses EPSG:6933. QA flag
  definitions need the associated paper or release documentation before interpreting flagged cells.'
