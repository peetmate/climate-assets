# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: un-spider-data-sources
title: UN-SPIDER Data Sources
description: A curated database linking to sources of satellite imagery, elevation models, land use/land cover
  maps and near real-time data products for different hazard types. Searchable by data type, hazard, disaster
  management phase, cost, temporal or spatial coverage, sensor and file type.
resource_type: service
keywords:
- global
- land-cover
- real-time
- remote-sensing
- satellite
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-13'
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
