id: climateaf-high-resolution-climate-africa
title: A high-resolution database of historical and future climate for Africa developed with deep neural networks
description: Data descriptor for ClimateAF, an interpolated climate database for Africa covering monthly, annual,
  decadal and 30-year normals from 1901 to present plus multi-model CMIP6 21st-century projections, built with
  thin-plate-spline interpolation, deep-learning orographic precipitation modelling and lapse-rate downscaling.
  Includes the ClimateAF software package and ~1 km gridded downloads.
resource_type: document
keywords:
- africa
- cmip
- downscaling
- high-resolution
- machine-learning
- precipitation
