cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: climate-shift-index
title: Climate Shift Index
description: A daily climate-attribution tool and global map showing how human-caused climate change has altered
  the frequency of local daily high, low and average temperatures, expressed on an 11-level scale (-5 to +5).
  Grounded in peer-reviewed attribution science.
resource_type: software
keywords:
- attribution
- dashboard
- global
- heat
- temperature
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-13'
