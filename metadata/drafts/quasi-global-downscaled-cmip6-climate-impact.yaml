updated: '2026-11-17'
doi: 10.5281/zenodo.21915837
version: '1'
license: CC-BY-4.0
access: public
note: 'The public Box folder includes country archives. The Vanuatu archive contains daily administrative-area
  Parquet files compressed with XZ.


  Local inventory review on 17 November 2026. The inspected Vanuatu tables are already Parquet, wrapped in
  XZ inside a country ZIP. Remove both wrappers and host the Parquet objects directly. The gridded product
  is NetCDF. Zenodo identifies the linked Box dataset and CC BY 4.0. Credit the creators, link the licence
  and identify changes. The README also requests citation of the paper, dataset, Box repository and original
  inputs. Anonymous Box download and byte-range read of a Vanuatu ZIP member succeeded. Its XZ-compressed Parquet
  was decoded locally.


  Download inventory checked on 2026-11-17. 20,956,214,274,037 bytes; 1,737 files. The provider’s Box listing
  reports this size and file count for its Data folder. Country ZIPs are counted as files; internal Parquet
  members and the separate Zenodo documentation are excluded.


  The release-level licensing rights holder or administrator is unknown. Published creators and contact authors
  have their documented roles only.


  Follow Box’s download control for the selected country archive; the included Vanuatu direct download route
  was range-read anonymously in the local audit. The release DOI has no provider version string, so version
  1 is this inventory’s initial record version. The gridded NetCDF layouts need inspection after extraction.
  Extracted and reformatted byte totals remain unknown.'
