id: quasi-global-downscaled-cmip6-climate-impact
title: Quasi-global, land-only, high-resolution and spatially averaged climate variables from downscaled CMIP6
  models for climate impact research
description: Bias-corrected, downscaled CMIP6 climate outputs at 0.1 degree daily resolution for 1985-2100
  (DBCCA method), covering 12 land-only domains between 60N and 60S from six CMIP6 models under SSP2-4.5 and
  SSP5-8.5, plus user-ready population-weighted variables aggregated to administrative units (levels 0-2) for
  110 countries prioritised for tropical health/disease impact research. NetCDF + Parquet, hosted via Box.
resource_type: dataset
keywords:
- cmip6
- downscaling
- bias-correction
- ssp
- climate-projections
- daily
- health
- tropical-disease
- netcdf
- parquet
- high-resolution
