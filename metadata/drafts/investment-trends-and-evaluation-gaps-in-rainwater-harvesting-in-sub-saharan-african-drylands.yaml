id: investment-trends-and-evaluation-gaps-in-rainwater-harvesting-in-sub-saharan-african-drylands
title: Investment trends and evaluation gaps in rainwater harvesting in Sub-Saharan African drylands
description: A systematic review of 34 government- and donor-funded rainwater harvesting projects implemented
  across Sub-Saharan Africa up to November 2024, examining investment trends, evaluation gaps and factors linked
  to sustained benefits. Identifies land tenure, post-construction maintenance and community-led design as
  success factors.
