title: 'CORDEX-ML-Bench: A Benchmark for Data-Driven Regional Climate Downscaling -Experiment Design and Overview'
description: Introduces CORDEX-ML-Bench, a standardized benchmark aligned with the CORDEX initiative that evaluates
  40 machine-learning downscaling configurations across the European Alps, New Zealand and Southern Africa.
  It targets downscaling of daily maximum temperature and precipitation to ~10 km resolution using a public
  dataset and common evaluation methods.
