cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: forty-global-forest-typology-10m
title: Forest Typology (ForTy) 2020 v1.0
description: Global 10 m map distinguishing six FAO-aligned forest and land classes - primary forest, naturally
  regenerating forest, planted forest, plantation forest, tree crops and agroforestry, and other land - rather
  than undifferentiated tree cover. Built with a custom deep-learning model over AlphaEarth Foundations satellite
  embeddings, trained on roughly 1.7 million labelled locations, and aligned with FAO and EU Deforestation
  Regulation definitions.
resource_type: dataset
keywords:
- forests
- deforestation
- land-cover
- agroforestry
- tree-crops
- eudr
- remote-sensing
- machine-learning
- foundation-model
- earth-engine
- high-resolution
- global
cdh:
  domain:
  - land
  - agricultural-production
created: '2026-11-13'
updated: '2026-11-13'
license: CC-BY-4.0
version: '1.0'
temporal:
  date: '2020'
data:
- name: primary
  locations:
  - url: https://earthengine.googleapis.com/v1/projects/nature-trace/assets/forest_typology/forest_typology_2020_v1_0_collection
access: restricted
