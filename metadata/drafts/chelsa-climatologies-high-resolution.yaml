# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: chelsa-climatologies-high-resolution
title: CHELSA (Climatologies at High Resolution for the Earth's Land Surface Areas)
description: Global high-resolution climate dataset providing temperature and precipitation climatologies plus
  19 bioclimatic variables, produced by mechanistic downscaling of ERA reanalysis that accounts for terrain,
  wind fields and orographic effects. Matching CMIP6 future projections are also available.
resource_type: dataset
keywords:
- cmip
- downscaling
- global
- high-resolution
- precipitation
- reanalysis
- temperature
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-13'
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
