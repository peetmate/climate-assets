# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: open-climate-ai
title: open-climate.ai — open emission factor library & matching agent
description: Search, export and API access over roughly 275,000 greenhouse-gas emission factor values harmonised
  from 33 public publisher libraries — including ADEME/AGRIBALYSE, EXIOBASE, US EPA, USEEIO, DESNZ, MITECO
  and ÖKOBAUDAT — onto a single data model that carries each factor's licence, attribution text and provenance.
  A reasoning-based matching agent maps free-text procurement or spend lines to GHG-Protocol-compliant factors,
  exposed through the web app, a read API and an MCP endpoint.
resource_type: service
keywords:
- emissions
- ghg
- emission-factors
- scope-3
- lca
- ai
- api
cdh:
  domain:
  - mitigation
  - climate
created: '2026-11-13'
updated: '2026-11-13'
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
