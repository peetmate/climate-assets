# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. Software licensing conflict tracked in gaps.csv.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: trends-earth-qgis
title: Trends.Earth QGIS plugin
version: 2.3.8
resource_type: software
description: >-
  QGIS plugin for drought hazard and population exposure, land degradation and SDG
  indicator 15.3.1 reporting. Version 2.3.8 supports custom total or sex-disaggregated
  population data. Check the package manifest for compatible QGIS versions.
keywords: [drought, population exposure, land degradation, QGIS, SDG 15.3.1]
cdh:
  domain: [land, climate]
access: public
citation:
  authors:
    - organization: Conservation International
  title: Trends.Earth
  date: '2026'
  url: https://trends.earth/
contact:
  - organization: Conservation International
    email: trends.earth@conservation.org
    roles: [producer, point-of-contact]
  - organization: CGIAR Climate Data Hub
    roles: [maintainer]
    url: https://github.com/peetmate/climate-assets
data:
  - name: qgis-plugin-zip
    description: Official installable QGIS plugin. The LDMP folder contains metadata.txt and LICENSE.
    media_type: application/zip
    locations:
      - url: https://plugins.qgis.org/plugins/LDMP/version/2.3.8/download/
  - name: tagged-source
    locations:
      - url: https://github.com/ConservationInternational/trends.earth/tree/v2.3.8
note: >-
  The guide gives GPL-2.0-or-later for the software. The tagged repository includes
  GPL and Apache texts, and the QGIS ZIP ships an Apache-2.0 LDMP/LICENSE.
  Applicable software terms need clarification. The guide gives CC-BY-4.0 for project
  products and documentation. Third-party inputs have their own licences.
  Version 2.3.4 fixed omission of year four from worst-drought periods. Versions 2.3.6
  and 2.3.8 improved population precision and resampling. The two Malawi packages
  identified in the source assessment ran drought-summary 2.1.17 in November 2025.
  Recompute before treating their exposure totals as corrected.
additional_links:
  - rel: describedby
    url: https://docs.trends.earth/en/latest/for_developers/changelog.html
  - rel: describedby
    url: https://docs.trends.earth/en/latest/general/index.html#license
  - rel: related
    url: https://plugins.qgis.org/plugins/LDMP/version/2.3.8/
created: '2026-11-16'
updated: '2026-11-16'
