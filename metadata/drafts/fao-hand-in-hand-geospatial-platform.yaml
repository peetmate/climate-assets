cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: fao-hand-in-hand-geospatial-platform
title: FAO Hand-in-Hand Geospatial Platform
description: A geospatial data platform hosting over a million geospatial layers and thousands of statistics
  series across more than ten domains linked to food and agriculture, including food security, crops, soil,
  land, water, climate, fisheries, livestock and forestry. Data are sourced from FAO and other UN, NGO, academic,
  private-sector and space-agency providers.
resource_type: service
keywords:
- food-security
- global
- livestock
- soils
cdh:
  domain:
  - agricultural-production
  - land
created: '2026-11-13'
updated: '2026-11-13'
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
