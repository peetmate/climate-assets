id: a-new-class-of-climate-hazard-metrics-ten-fold-increase-extreme-heat-europe
title: 'A new class of climate hazard metrics and its demonstration: revealing a ten-fold increase of extreme
  heat over Europe'
description: Introduces threshold-exceedance-amount metrics that jointly track frequency, duration, magnitude,
  area and timing of weather and climate extremes. Applied to Europe, it finds roughly a ten-fold increase
  in the total extremity of extreme heat in 2010-2024 relative to 1961-1990. Led by researchers at the University
  of Graz.
