# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: fews-net-data-explorer
title: FEWS NET Data Explorer (FDW)
description: 'Interactive data explorer for the FEWS NET Data Warehouse (FDW) - the Famine Early Warning Systems
  Network''s food-security data: staple food and livestock market prices, crop and livestock production, and
  acute food-insecurity (IPC-compatible) classifications, visualised for early warning across food-insecure
  regions.'
resource_type: software
keywords:
- food-security
- early-warning
- famine
- prices
- markets
- ipc
- production
- dashboard
- real-time
- usaid
- africa
cdh:
  domain:
  - climate
  - agricultural-production
created: '2026-11-13'
updated: '2026-11-13'
data:
- name: primary
  locations:
  - url: https://fdw.fews.net/data-explorer/visualizations
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
