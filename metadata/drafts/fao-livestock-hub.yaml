# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: fao-livestock-hub
title: FAO Livestock Hub
description: FAO's single gateway to its livestock data, analytical tools and knowledge, launched in September
  2026 at the 2nd Global Conference on Sustainable Livestock Transformation. Dashboards organised by theme
  and geography cover livestock production, animal health risks and antimicrobial resistance, climate and environmental
  interactions — including GLEAM greenhouse-gas estimates for animal populations, products, emissions and emission
  intensities — alongside economic and social indicators, with a Livestock AI Assistant for navigating across
  them.
resource_type: service
keywords:
- livestock
- ghg
- emissions
- gleam
- animal-health
- antimicrobial-resistance
- dashboard
- food-security
- global
cdh:
  domain:
  - agricultural-production
  - mitigation
created: '2026-11-13'
updated: '2026-11-13'
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
