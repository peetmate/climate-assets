id: google-agricultural-understanding-platform
title: Agricultural Understanding Platform (AnthroKrishi), Google
description: Demonstration map for Google's AnthroKrishi Agricultural Landscape Understanding platform, which
  uses high-resolution satellite imagery and machine learning to delineate field boundaries and infer crop
  type, field size, water availability and market access. APIs are currently available for India with planned
  expansion to other regions.
resource_type: service
keywords:
- ai
- crop-mapping
- high-resolution
- india
- machine-learning
- remote-sensing
- satellite
- south-asia
