id: eth-cocoa-suitability-map
title: Satellite-based high-resolution maps of cocoa planted area for C\^ote d'Ivoire and Ghana
description: Deep-learning maps of cocoa planted area for Côte d'Ivoire and Ghana from satellite imagery, validated
  in situ. Finds cocoa drives >37% and 13% of protected-area forest loss respectively, and that official reports
  underestimate planted area by up to 40% (Ghana).
