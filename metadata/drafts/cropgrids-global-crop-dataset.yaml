structures:
- name: crop-areas
  variables:
  - name: harvarea
    description: Harvested area of the named crop within the grid cell.
    unit: ha
  - name: croparea
    description: Cropped physical area of the named crop within the grid cell.
    unit: ha
  - name: qual
    description: Data quality score. One is highest, zero is lowest.
    unit: '1'
  - name: set
    description: Source dataset code; interpret using the Dataset attribute stored on this variable.
note: Inventory review checked 2026-11-17. The v1.08 crop maps are NetCDF files inside ZIP archives. Prepare a
  chunked store for direct cloud access. CC BY 4.0 allows sharing and adaptation. Credit the creators, link the
  licence and identify changes. A reader retrieved data from the reviewed distribution without credentials, a
  form or paid access. Stored download volume is 948,409,515 bytes across 6 files. Six deposit files include the
  map archives, code archive, workbook and two PDFs. The NetCDF map archive contains 174 NetCDF members including
  the country grid. The sampled CROPGRIDSv1.08_popcorn.nc has 3,600 latitude by 7,200 longitude cells at 0.05
  degree spacing. Variables harvarea and croparea are hectares per cell; qual is a zero-to-one quality score and
  set identifies the input dataset. Each variable marks ocean with -1. Use lon and lat coordinate arrays to select
  cells. The reference year is 2020. A separately named licensing rights holder remains unknown.
