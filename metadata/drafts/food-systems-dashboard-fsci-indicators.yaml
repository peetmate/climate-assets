id: food-systems-dashboard-fsci-indicators
title: Food Systems Dashboard FSCI Indicators
description: 'A section of the Food Systems Dashboard presenting the Food Systems Countdown Initiative (FSCI)
  indicators, a framework of around 50 indicators across five themes: diets/nutrition/health; environment,
  natural resources and production; livelihoods, poverty and equity; governance; and resilience. It supports
  annual monitoring of global food systems.'
