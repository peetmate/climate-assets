id: fao-gleam-global-livestock-environmental-assessment-model
title: GLEAM (Global Livestock Environmental Assessment Model) R package
description: An R package implementing the FAO Global Livestock Environmental Assessment Model, which simulates
  livestock systems and estimates greenhouse gas emissions based on herd dynamics, feed and energy flows. GLEAM
  uses a GIS life-cycle-assessment framework covering major livestock commodities at (sub)national, regional
  and global scale.
