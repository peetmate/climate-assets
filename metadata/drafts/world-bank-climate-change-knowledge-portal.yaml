id: world-bank-climate-change-knowledge-portal
title: World Bank Climate Change Knowledge Portal
description: A free online hub for climate-related data, projections and tools providing historical and future
  climate, vulnerability and impact information for 196 countries and territories. It includes climate, disaster
  risk and socio-economic datasets plus synthesis products such as Climate Risk Country Profiles, at national,
  sub-national and watershed scales.
resource_type: service
