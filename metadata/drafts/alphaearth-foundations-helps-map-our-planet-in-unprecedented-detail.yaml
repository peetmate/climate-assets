title: AlphaEarth Foundations Helps Map Our Planet in Unprecedented Detail
description: Announcement of AlphaEarth Foundations, a geospatial foundation model that integrates satellite
  imagery, radar, LiDAR, elevation and climate data into unified annual 10-metre-resolution embeddings of the
  planet's land and coastal waters. The embeddings support downstream mapping and analysis tasks such as ecosystem
  classification and change detection.
