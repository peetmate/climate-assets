id: downscaled-gridded-global-dataset-gdp-per-capita-ppp-1990-2022
title: Downscaled gridded global dataset for gross domestic product (GDP) per capita PPP over 1990-2022
description: Annual GDP per capita at purchasing power parity (PPP) for 1990–2022. National and subnational
  estimates are harmonised and downscaled to 43,501 administrative units. Gridded GDP per capita represents
  an administrative estimate assigned to cells. Separate products provide total GDP.
resource_type: dataset
keywords:
- downscaling
- global
- machine-learning
- poverty
