note: Zenodo version 3 is the last release covering precisely 1990–2022. The provider recommends its newer
  1990–2024 release for current applications. Cite the accompanying Kummu, Kosonen and Masoumzadeh Sayyar (2025)
  paper when using these data. Values are constant 2017 international dollars per person, adjusted for purchasing
  power. Inventory audit checked 2026-11-17. The v3 admin-2 GDP raster uses strips. Prepare a COG or a chunked
  time-series store for selective reads. CC BY 4.0 allows sharing and adaptation. Credit the creators, link
  the licence and identify changes. The assessed release contains 14 files. Stored download size is 2,265,645,659
  bytes. Published deposit, including any documentation and archives. Archive members are not counted separately.
  These are provider download volumes; converted storage requirements remain unknown. Licensing rights-holder
  identity is unknown.
data:
- name: admin2-per-capita-grid
  description: Global 30 arc-minute multiband GeoTIFF. Band 1 is 1990 and band 33 is 2022. Sample a populated
    land coordinate in longitude, latitude order and mask the raster NoData value. Read the value as GDP per
    capita for the represented area.
  media_type: image/tiff
  file_size: 4822876
  locations:
  - url: https://zenodo.org/api/records/16741980/files/rast_adm2_gdp_perCapita_1990_2022_30arcmin.tif/content
  checksum: md5:061e6841746e70546b07d9f12e8f654e
- name: national-per-capita-table
  description: National estimates for the same release. Match a country using iso3 or Country and read the
    year from its named column, e.g. 2022. The table gives a national estimate.
  media_type: text/csv
  file_size: 50808
  locations:
  - url: https://zenodo.org/api/records/16741980/files/tabulated_adm0_gdp_perCapita.csv/content
