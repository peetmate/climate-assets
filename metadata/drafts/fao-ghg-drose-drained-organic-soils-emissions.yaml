id: fao-ghg-drose-drained-organic-soils-emissions
title: FAO GHG Drained Organic Soils Emissions (Annual)
description: FAOSTAT estimates of CO2 and N2O greenhouse-gas emissions from drained organic (histosol) soils
  under cropland and grassland, computed in Google Earth Engine using IPCC Tier I methods with annual land-cover
  maps. Emission layers reported in tonnes/hectare.
resource_type: dataset
keywords:
- carbon
- earth-engine
- global
- land-cover
- soils
cdh:
  domain:
  - mitigation
  - land
