id: fao-ghg-drose-drained-organic-soils-emissions
title: Drained Organic Soils Emissions (Annual) 1.0
description: FAO annual global grids of carbon and nitrous oxide emissions from drained cropland and grazed grassland
  organic soils, 1992–2018. Estimates use histosols as a proxy for organic soils and a Tier 1 method. The cells
  span 30 arc-seconds, about 928 metres at the equator.
resource_type: dataset
keywords:
- carbon
- earth-engine
- global
- land-cover
- soils
