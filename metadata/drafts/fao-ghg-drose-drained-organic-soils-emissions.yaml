data:
- name: cropland-nitrous-oxide-1992
  description: Estimated nitrous oxide emitted by agricultural drainage of cropland organic soils in one raster
    cell in 1992, in gigagrams of N2O.
  locations:
  - url: https://storage.googleapis.com/fao-gismgr-faostat-data/DATA/FAOSTAT/MAPSET/DROSE-A/FAOSTAT.DROSE-A.1992.CROP.N2O.tif
  media_type: image/tiff; application=geotiff
  file_size: 41722737
  structures:
  - cropland-nitrous-oxide-grid
structures:
- name: cropland-nitrous-oxide-grid
  variables:
  - name: band1
    description: Estimated nitrous oxide emitted by agricultural drainage of cropland organic soils in one raster
      cell in 1992, in gigagrams of N2O.
    unit: Gg
note: Open the FAO GeoTIFF directly or through GDAL /vsicurl/ and read its single band at a land coordinate, using
  the file’s NoData mask. One Gg is 1,000 metric tonnes. To select another file, use the object inventory. The filename
  encodes year, land use (CROP or GRASS) and emitted substance (CRB for elemental carbon or N2O for nitrous oxide).
  The corresponding Earth Engine bands are croplandc, grasslandc, croplandn2o and grasslandn2o. Earth Engine pixel
  access requires a registered project. The FAO bucket accepts anonymous reads.
