cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: unfccc-ghg-data-interface
title: UNFCCC Greenhouse Gas Data Interface
description: The official interface providing access to greenhouse gas data reported by Parties to the Climate
  Change Convention, from Annex I annual GHG inventory submissions and non-Annex I national communications
  and biennial update reports. Data are presented in tabular and graphical form and many tables are downloadable
  as Excel spreadsheets.
resource_type: service
keywords:
- carbon
- global
- methane
cdh:
  domain:
  - mitigation
created: '2026-11-13'
updated: '2026-11-13'
data:
- name: primary
  locations:
  - url: https://data.unfccc.int/
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
