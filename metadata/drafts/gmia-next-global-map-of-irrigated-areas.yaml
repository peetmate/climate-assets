note: 'Local inventory review on 17 November 2026. The sampled Africa probability TIFF has 512 × 512 tiles
  and no overviews. Prepare a COG with overviews for multi-scale access. CC BY 4.0 allows sharing and adaptation.
  Credit the creators, link the licence and identify changes. A reader retrieved data from the reviewed distribution
  without credentials, a form or paid access.


  Download inventory checked on 2026-11-17. 15,445,363,239 bytes; 10 files. Published deposit, including any
  documentation and archives. Archive members are not counted separately.


  The release-level licensing rights holder or administrator is unknown. Published creators and contact authors
  have their documented roles only.


  The provider README defines probability raster values as 0–100 percent probability that a 30 m cropland pixel
  was irrigated during 2023/24. Binary products encode irrigated as 1 and non-irrigated as 0, using either
  a fixed 50% or a dynamically optimized threshold. Honour each GeoTIFF’s NoData value and geotransform. The
  ground-truth training/validation dataset is a separate deposit.'
