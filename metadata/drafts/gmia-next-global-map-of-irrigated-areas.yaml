id: gmia-next-global-map-of-irrigated-areas
title: 'GMIA-NEXT: Next-Generation Global Map of Irrigated Areas'
description: A 30 m global map of irrigated areas for the 2023/24 growing season, produced by fusing multi-source
  Earth-observation and environmental data with machine learning trained on ~384,000 georeferenced ground-truth
  points. Offers much finer resolution and timeliness than earlier global irrigation datasets (e.g. FAO GMIA).
resource_type: dataset
keywords:
- irrigation
- remote-sensing
- machine-learning
- land-cover
- high-resolution
- global
- water
