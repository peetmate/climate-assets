id: fao-soilfer-cropsuit
title: SoilFER CropSuit
description: Free web-based decision-support application under FAO's SoilFER programme that combines soil,
  climate, topography and land-cover data to identify crops most likely to perform well in a given location.
  Built on the FAO/IIASA Agro-Ecological Zoning framework.
resource_type: software
