id: xclim-climate-indicators
title: xclim Climate Indicators
description: Documentation for xclim's climate indicators, Python objects that compute climate indices (e.g.
  temperature and precipitation statistics, extremes) with input health checks, missing-value handling and
  CF-compliant output attributes. Indicators are organised into atmos, land and seaIce realms.
resource_type: software
