id: satellite-foundation-model-wealth-monitoring
title: A satellite foundation model for improved wealth monitoring
description: Preprint introducing a satellite foundation model self-supervised on ~3 million bi-temporal Landsat
  image pairs and adapted with parameter-efficient fine-tuning to sparse survey labels, to predict economic
  livelihoods and wealth at scale where censuses and household surveys are costly, infrequent or outdated -
  aimed at improving poverty and wealth monitoring in low- and middle-income countries.
resource_type: document
