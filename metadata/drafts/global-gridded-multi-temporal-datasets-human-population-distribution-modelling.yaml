id: global-gridded-multi-temporal-datasets-human-population-distribution-modelling
title: Global gridded multi-temporal datasets to support human population distribution modelling
description: WorldPop harmonised geospatial covariates for population modelling, version 1.0. Country GeoTIFFs for
  242 countries or territories use a common 3 arc-second grid (about 100 m at the equator). Coverage varies by covariate.
  Climate and nighttime-light series cover 2015–2023, built-up layers extend to 2030 and some variables are static.
resource_type: dataset
