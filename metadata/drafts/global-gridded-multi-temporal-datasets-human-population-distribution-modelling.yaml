data:
- name: nauru-land-surface-temperature-2023
  description: Nauru annual mean land surface temperature, 2023. Read band 1 as float32 kelvin and mask -99999.
    For a sample, select a valid land pixel, use its pixel-centre coordinates in WGS 84 and report the stored value.
    This MODIS Terra-derived covariate measures land surface temperature.
