id: global-gridded-multi-temporal-datasets-human-population-distribution-modelling
title: Global gridded multi-temporal datasets to support human population distribution modelling
description: Data note describing a global collection of annual, spatio-temporally harmonised gridded geospatial
  covariates (topography, climate, nighttime lights, land cover, inland water, infrastructure, protected areas,
  built-up environment) developed to support high-resolution population distribution modelling. Authors include
  Woods, McKeen, Cunningham, Priyatikanto, Sorichetta, Tatem and Bondarenko.
resource_type: dataset
keywords:
- global
- high-resolution
- land-cover
- satellite
