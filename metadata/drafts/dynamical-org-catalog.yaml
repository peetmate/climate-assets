# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: dynamical-org-catalog
title: dynamical.org data catalog
description: Public, live-updating catalog of cloud-optimized weather and climate datasets (GFS, GEFS, HRRR,
  IFS ENS, MRMS, AIFS) in Icechunk/Zarr format, normalised to common chunking, variable names and coordinate
  conventions and hosted on the AWS Open Data registry.
resource_type: service
keywords:
- api
- global
- real-time
- weather-model
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-13'
data:
- name: primary
  locations:
  - url: https://dynamical.org/catalog/
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
