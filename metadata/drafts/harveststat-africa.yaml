structures:
- name: crop-statistics
  variables:
  - name: production
    description: Quantity produced, in metric tonnes.
    unit: t
  - name: area
    description: Cropped area, in hectares.
    unit: ha
  - name: yield
    description: Crop yield, in metric tonnes per hectare.
    unit: t/ha
  - name: qc_flag
    description: Provider quality flag for the record.
    categories:
    - value: 0
      label: No flag
    - value: 1
      label: Outlier
    - value: 2
      label: Low variance
