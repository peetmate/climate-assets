# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: harveststat-africa
title: HarvestStat Africa – Harmonized Subnational Crop Statistics for Sub-Saharan Africa
description: Harmonized subnational crop statistics. The v1.2 CSV in Dryad release 12 contains 217,487 rows
  from 33 Sub-Saharan African countries, with 92 distinct crop labels and 1,041 geographic unit identifiers.
resource_type: dataset
keywords:
- africa
- food-security
- yield-forecast
cdh:
  domain:
  - agricultural-production
created: '2026-11-13'
updated: '2026-11-16'
doi: 10.5061/dryad.vq83bk42w
license: CC0-1.0
version: '12'
access: public
temporal:
  start_date: '1960'
  end_date: '2026'
note: >-
  Coverage here uses observed harvest years. The earliest harvest in the v1.2 CSV is November 1960,
  the latest April 2026. Coverage varies by crop and place. The provider flags post-2024 seasons in
  Somalia as potentially incomplete. Join boundaries from the same release on fnid, especially for
  Ethiopia, whose geographic keys changed. The v1.0 paper counts 574,204 individual measurements
  (198,346 production, 190,428 area and 185,430 yield). Counting nonmissing values in the v1.2 CSV gives
  213,884 production, 204,972 area and 201,259 yield across 217,487 rows. The checksum below matches
  the Dryad file. Dryad publishes the deposit under CC0. The tagged GitHub repository README describes
  repository data as MIT. The scope of that separate statement needs author confirmation.
related_publications:
- doi: 10.1038/s41597-025-05001-z
additional_links:
- rel: describedby
  title: Provider v1.2 release notes and column definitions
  url: https://github.com/HarvestStat/HarvestStat-Africa/releases/tag/v1.2
- rel: describedby
  title: Dryad release 12 file inventory and checksums
  url: https://datadryad.org/api/v2/versions/452999/files
- rel: license
  title: CC0 declaration registered for the Dryad DOI
  url: https://api.datacite.org/dois/10.5061/dryad.vq83bk42w
- rel: describedby
  title: Project repository statement about MIT licensing
  url: https://github.com/HarvestStat/HarvestStat-Africa/blob/v1.2/README.md#license
data:
- name: harveststat-csv
  structures:
  - crop-statistics
  checksum: sha256:f659e121e315b9d8656699e4b16421ed3b313e4c8d09d15199452000836dbef9
  locations:
  - url: https://raw.githubusercontent.com/HarvestStat/HarvestStat-Africa/4104ce0abfc09277cf6f9db420854b686e96337f/public/hvstat_africa_data_v1.2.csv
- name: dryad-archive
  locations:
  - url: https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.vq83bk42w/download
structures:
- name: crop-statistics
  variables:
  - name: production
    description: Quantity produced, in metric tonnes.
    unit: t
  - name: area
    description: Cropped area, in hectares.
    unit: ha
  - name: yield
    description: Crop yield, in metric tonnes per hectare.
    unit: t/ha
  - name: qc_flag
    description: Provider quality flag for the record.
    categories:
    - value: 0
      label: No flag
    - value: 1
      label: Outlier
    - value: 2
      label: Low variance
contact:
- organization: University of Manitoba
  roles:
  - point-of-contact
  name: Donghoon Lee
  url: https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.vq83bk42w
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
