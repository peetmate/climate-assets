title: HarvestStat Africa – Harmonized Subnational Crop Statistics for Sub-Saharan Africa
description: Harmonized subnational crop statistics for Sub-Saharan Africa with ~574,204 records covering quantity
  produced, harvested area and yield. Provides a consistent long-term baseline for agricultural production
  and yield analysis.
