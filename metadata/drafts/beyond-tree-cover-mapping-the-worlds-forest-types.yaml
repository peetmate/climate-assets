id: beyond-tree-cover-mapping-the-worlds-forest-types
title: 'Beyond tree cover: mapping the world''s forest types'
description: Blog post introducing Forest Typology (ForTy), a global 10 m map that separates primary, naturally
  regenerating, planted and plantation forest from tree crops and agroforestry instead of treating all tree
  cover alike. Explains the motivation for FAO- and EUDR-aligned classes, the use of AlphaEarth Foundations
  embeddings, and the partnership behind it.
resource_type: document
