id: global-mobile-network-coverage-1km-1999-2030
title: A global mobile network coverage raster product at 1km resolution, 1999--2030
description: Preprint describing annual 1 km maps of the probability of 2G, 3G and 4G mobile coverage for 214
  countries and territories from 1999 to 2030. Three independent models - a calibrated machine-learning model,
  a techno-economic simulator of network build-out and a spatial deep-learning model - are combined per country
  and technology in proportion to their measured accuracy, giving a best estimate with per-pixel 90% uncertainty
  bands; all four layers are released.
