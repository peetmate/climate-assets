note: Inventory audit checked 2026-11-17. The gridded baseline and scenario rasters are packaged in ZIP files.
  Extract and prepare the selected grids for direct cloud access. CC BY 4.0 allows sharing and adaptation.
  Credit the creators, link the licence and identify changes. The assessed release contains 2 files. Stored
  download size is 30,038,953,418 bytes. Published deposit, including any documentation and archives. Archive
  members are not counted separately. These are provider download volumes; converted storage requirements remain
  unknown. Licensing rights-holder identity is unknown. The provider describes a 4,320 × 1,673 grid in EPSG:4326
  with 0.083333-degree cells (about 10 km at the equator). Baselines are 2000, 2010 and 2020; projections are
  decadal 2030–2100 under SSP1–5. Predicted values are raw model output; corrected values match ILO totals.
  Read the selected TIFF band as people working in agriculture per cell, retain the fractional model estimate,
  and mask its NoData value.
