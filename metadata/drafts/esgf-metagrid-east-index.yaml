# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: esgf-metagrid-east-index
title: ESGF MetaGrid (East index)
description: Faceted search portal (MetaGrid) for the ESGF East index, the CEDA-hosted route into federated
  climate model output — currently CMIP7 and CORDEX-CMIP6, filterable by MIP era, activity, institution, model,
  experiment, variant, table, variable and grid label. Files are retrievable by HTTP download, wget script,
  OPeNDAP or Globus transfer; searching and HTTP download need no account, while Globus transfers, saved searches
  and a persistent data cart require sign-in.
resource_type: service
keywords:
- esgf
- cmip7
- cmip6
- cordex
- climate-projections
- downscaling
- global
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-13'
data:
- name: primary
  locations:
  - url: https://metagrid-ceda.east.esgf.io/search
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
