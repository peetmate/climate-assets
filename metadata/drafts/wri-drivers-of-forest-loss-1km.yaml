id: wri-drivers-of-forest-loss-1km
title: Global drivers of forest loss at 1 km resolution
description: Global 1 km raster of the dominant driver of tree cover loss during 2001–2025. Seven driver classes
  cover permanent agriculture, hard commodities, shifting cultivation, logging, wildfire, settlements and infrastructure,
  and other natural disturbances. The release includes training and validation samples.
