id: mapping-the-planet-with-earth-index-is-now-open-to-everyone
title: Mapping the Planet with Earth Index is Now Open to Everyone
description: Blog post announcing that Earth Index, a tool that searches global satellite imagery by visual
  similarity using Earth foundation models, is now openly available worldwide. Users select example features
  (e.g. deforestation, mining, airstrips) and the system interactively finds similar patterns across the planet.
