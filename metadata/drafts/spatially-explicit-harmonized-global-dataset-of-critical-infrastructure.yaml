id: spatially-explicit-harmonized-global-dataset-of-critical-infrastructure
title: A spatially-explicit harmonized global dataset of critical infrastructure
description: Global infrastructure rasters and the Critical Infrastructure Spatial Index (CISI), derived from
  the 8 January 2021 OpenStreetMap extract. The data cover 39 infrastructure types in seven systems, provided
  on 0.10-degree and 0.25-degree grids.
