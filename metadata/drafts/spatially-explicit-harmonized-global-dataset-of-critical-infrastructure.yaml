  file_size: 85938025
  media_type: application/zip
  checksum: md5:d6306f7da0f27324203c97c552fc57f7
  description: Archive of global and continent-normalized CISI and system sub-scores. Select a TIFF by resolution
    and region, inspect its CRS and NoData value, then read a valid land cell. CISI is dimensionless, from
    0 (no infrastructure intensity) to 1 (highest intensity) within its normalization domain.
- name: Amount_of_infrastructure.zip
