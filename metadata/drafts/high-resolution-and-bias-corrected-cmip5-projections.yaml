note: 'The CCAFS distribution provides an anonymous ZIP for the named model and period. The WDCC record is
  the archival citation. Monthly layers represent 30-year climatologies.


  Local inventory review on 17 November 2026. The linked CCAFS distribution packages monthly climate layers
  in model and period ZIP files. Prepare a directly accessible grid store. WDCC declares CC BY 4.0 for its archive. The linked CCAFS
  download page, last updated 2015, requires written permission for commercial, non-free resale or redistribution.
  Whether the later WDCC licence covers the sampled S3 distribution remains unknown. A reader retrieved data from the reviewed distribution
  without credentials, a form or paid access.


  Download inventory checked on 2026-11-17. 4,235,935,512,583 bytes; 20,803 objects. Complete public CCAFS
  CMIP5 S3 prefix. Includes 17,815 ZIPs plus ancillary objects and empty processing markers. Excludes directory
  keys. The separate WDCC archive reports 6,826,309,928,877 bytes for 35 models. Its physical file count is
  unconfirmed.


  The release-level licensing rights holder or administrator is unknown. Published creators and contact authors
  have their documented roles only.


  The 4,235,935,512,583-byte S3 prefix and the WDCC 6,826,309,928,877-byte archive are different distributions.
  The S3 total includes 17,815 ZIPs and ancillary objects. The original WDCC physical-file count is unknown;
  35 denotes climate models. The sample ZIP below is 5,475,820 bytes.'
