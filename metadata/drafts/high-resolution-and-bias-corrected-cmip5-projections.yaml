title: CCAFS-CMIP5 Delta Method Downscaling for monthly averages and bioclimatic indices of four RCPs
description: Delta-method, bias-corrected CMIP5 climatologies for 35 climate models and four RCPs. Monthly
  maximum and minimum temperature, precipitation and derived bioclimatic indices are available at 30 arc-seconds
  and at 2.5, 5 and 10 arc-minutes.
