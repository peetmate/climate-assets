title: What climate-smart agriculture means for smallholder farmers
description: A report analysing the exposure of smallholder farmers to climate hazards such as drought, flooding
  and extreme heat across India, Ethiopia and Mexico, and identifying 33 climate adaptation and mitigation
  measures. It examines feasibility of adoption and the implications for food security and emissions.
