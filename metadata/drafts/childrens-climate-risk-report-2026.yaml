id: childrens-climate-risk-report-2026
title: Children's Climate Risk Report 2026
description: UNICEF report providing a global picture of where children face the greatest climate risks, pairing
  exposure to eight common climate hazards with children's vulnerability. It reports that about 1.1 billion
  children are exposed to at least three overlapping climate hazards, drawing on UNICEF's Global Child Hazard
  Database and a new Children's Climate Risk Framework.
resource_type: document
keywords:
- extreme-events
- food-security
- global
- poverty
