id: jrc-asap-crop-calendars
title: EU JRC ASAP — national and subnational crop calendars
description: Crop-specific planting, growth and harvest windows in national and subnational tables, derived
  by matching FAO crop calendars to satellite land-surface phenology. Covers selected matching crop–location
  combinations; supports seasonal interpretation of indicators and warnings.
resource_type: dataset
keywords:
- asap
- jrc
- crop-calendar
- planting
- harvest
- phenology
- global
