updated: '2026-11-19'
access: public
note: 'Checked 2026-11-19. Two ZIPs total 29,664 bytes and contain two semicolon-delimited CSVs plus two dictionaries.
  National table has 287 rows; subnational table 3,068. Dekads run 1–36 each year; windows may cross December–January.
  Use asap0_id for national boundaries and asap1_id for subnational boundaries; download-page prose mislabels
  the second ZIP and join field. File dictionaries and JRC catalogue resolve the mismatch. These are typical,
  selectively matched calendars, not observed planting dates for a specific year. Dataset version, reference
  period and preferred update cadence remain unknown. Two ZIP-compressed CSV tables with field dictionaries.
  Unpack and convert to Parquet for selective access; GeoParquet additionally requires separately licensed
  matching boundary geometry. European Commission reuse notice: acknowledge the source and retain notices.
  Applies to the JRC-distributed tables; third-party materials and separately downloaded administrative boundaries
  require their own terms. The technical report licence is not substituted for data terms. crop_calendar_gaul0.zip
  3,342 bytes and crop_calendar_gaul1.zip 26,322 bytes. Four uncompressed members: two CSVs (10,342 and 156,337
  bytes) and two field dictionaries (388 and 532 bytes). Total expanded 167,599 bytes. Excludes optional boundary
  shapefiles and satellite phenology rasters. Decode semicolon-separated CSV and bundled *_notes.txt. Fields
  sos_s/sos_e delimit planting; sos_e/eos_s delimit growth; eos_s/eos_e delimit harvest. A dekad is days 1–10,
  11–20 or 21–month end; 36 dekads per calendar year. If end precedes start, the window wraps into the next
  calendar year. No year column is supplied; do not assign a specific observation year. National identifiers
  are asap0_id; subnational rows include asap0_id and asap1_id. The two CSVs contain 95 and 96 distinct crop_name
  strings including season labels, not counts of botanical crops. The satellite phenology rasters listed elsewhere
  on ASAP are a separate product. The provider catalogue issued date is 2018-09-26, while its current generated
  citation says 2026; neither establishes a new calendar release. Missing crop/location rows are not evidence
  of absence of cultivation.'
