id: climate-impact-lab
title: Climate Impact Lab
description: A nonprofit research collaboration (UC Berkeley, EPIC-University of Chicago, Rhodium Group, Rutgers)
  that quantifies the real-world impacts of climate change sector-by-sector and location-by-location, covering
  mortality, labour, agriculture, conflict, infrastructure and energy demand. Data are published openly under
  CC BY 4.0 and via the Human Climate Horizons and Impact Map tools.
resource_type: service
keywords:
- extreme-events
- global
- heat
cdh:
  domain:
  - climate
  - socioeconomic
