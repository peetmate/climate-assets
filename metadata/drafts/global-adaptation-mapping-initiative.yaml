id: global-adaptation-mapping-initiative
title: Global Adaptation Mapping Initiative (GAMI)
description: An international collaborative initiative that systematically maps and codes documented human
  adaptation responses to climate change from the scientific and grey literature (over 3,000 peer-reviewed
  articles coded by 100+ researchers). The database informed the IPCC AR6 process and is publicly accessible
  for further research.
resource_type: service
