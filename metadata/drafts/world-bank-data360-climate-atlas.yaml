# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: world-bank-data360-climate-atlas
title: World Bank Data360 Climate Atlas
description: A curated atlas within the World Bank Data360 platform focused on exposure, vulnerability and
  adaptation to climate hazards. It measures the population living in areas affected by a given climate-related
  hazard (using a 100-year return period) across more than 200 economies.
resource_type: service
keywords:
- dashboard
- flood
- global
cdh:
  domain:
  - climate
  - socioeconomic
created: '2026-11-13'
updated: '2026-11-13'
data:
- name: primary
  locations:
  - url: https://data360.worldbank.org/en/atlas/climate
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
