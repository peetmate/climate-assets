id: projections-of-future-agricultural-management-and-crop-choice-under-ssps
title: Projections of future agricultural management and crop choice under shared socioeconomic pathways
description: National crop-share and agricultural-management projections under six SSP-RCP scenarios. The provider
  README describes 197 countries and regions and projection years 2020–2100 in five-year increments. The SSP2-4.5
  CSV contains 243 distinct areacode values and a 2019 baseline; the relationship between the documented coverage
  and those rows remains unknown.
note: 'Central harvested-area shares are stored as fractions. In the Armenia 2025 SSP2-4.5 cereal row the value
  labelled lower bound (0.6034061) exceeds the upper bound (0.5617808). Check the interval definitions before
  using these columns.


  Local inventory review on 17 November 2026. Figshare v1 distributes six scenario projection CSVs and fourteen
  regression-output Excel workbooks, plus a Stata script and README. Convert the tabular files to Parquet for
  selective reads. CC BY 4.0 allows sharing and adaptation. Credit the creators, link the licence and identify
  changes. A reader retrieved data from the reviewed distribution without credentials, a form or paid access.


  Download inventory checked on 2026-11-17. 6,682,948 bytes; 22 files. Published deposit, including any documentation
  and archives. Archive members are not counted separately.


  The release-level licensing rights holder or administrator is unknown. Published creators and contact authors
  have their documented roles only.


  The README describes Rh_* as harvested-area proportions and labels them as percentages. The CSV stores central
  crop shares as fractions; multiply by 100 for percentage presentation. The management indicators crlb, ferNpL,
  malb and irlb describe farm size, fertilizer application, machinery and irrigation. Their units are unknown
  from the README. The _ssp, _lb and _ub suffixes identify the central estimate and stated 90% confidence bounds.
  The coverage-count discrepancy and reversed interval bounds require clarification.'
