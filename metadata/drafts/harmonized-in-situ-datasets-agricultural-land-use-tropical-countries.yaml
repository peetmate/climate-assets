id: harmonized-in-situ-datasets-agricultural-land-use-tropical-countries
title: Harmonized in situ datasets for agricultural land use mapping and monitoring in tropical countries
description: Describes a database of 24 harmonized in situ datasets collected under the JECAM initiative over
  nine sites in seven tropical countries between 2013 and 2020 (27,074 polygons). The data support production
  and validation of cropland and crop-type maps and evaluation of classification methods.
