cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: jecam-harmonized-in-situ-crop-type-dataset-cirad-dataverse
title: Harmonized in situ JECAM datasets for agricultural land use mapping and monitoring in tropical countries
  (dataset)
description: 'The harmonized in situ crop-type dataset (24 datasets, 27,074 polygons: 20,257 crop and 6,817
  non-crop) collected 2013-2020 over nine JECAM sites in seven tropical countries, with precise geographic
  coordinates and a common protocol. Distributed under a CC-BY license and usable in GIS software, filterable
  by region, year or keyword.'
resource_type: dataset
keywords:
- crop-mapping
- land-cover
cdh:
  domain:
  - agricultural-production
created: '2026-11-13'
updated: '2026-11-13'
doi: 10.18167/DVN1/P7OLAP
contact:
