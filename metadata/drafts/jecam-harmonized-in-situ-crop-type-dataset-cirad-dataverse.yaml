# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: jecam-harmonized-in-situ-crop-type-dataset-cirad-dataverse
title: Harmonized in situ JECAM datasets for agricultural land use mapping and monitoring in tropical countries
  (dataset)
description: 'The harmonized in situ crop-type dataset (24 datasets, 27,074 polygons: 20,257 crop and 6,817
  non-crop) collected 2013-2020 over nine JECAM sites in seven tropical countries, with precise geographic
  coordinates and a common protocol. Distributed under a CC-BY license and usable in GIS software, filterable
  by region, year or keyword.'
resource_type: dataset
keywords:
- crop-mapping
- land-cover
cdh:
  domain:
  - agricultural-production
created: '2026-11-13'
updated: '2026-11-16'
doi: 10.18167/DVN1/P7OLAP
version: '2'
license: CC-BY-4.0
temporal:
  start_date: '2013'
  end_date: '2020'
spatial:
  crs: EPSG:4326
  geography:
  - brazil
  - burkina-faso
  - cambodia
  - kenya
  - madagascar
  - senegal
  - south-africa
access: non-public
access_note: >-
  CIRAD deaccessioned V2.0 and V2.1. Both records describe the 27,074-polygon
  release and name BD_JECAM_CIRAD_2021.tar.gz. Neither offers a public download
  of that archive. A publicly downloadable subset is listed below. Audrey Jolivot
  is the corresponding author for enquiries about the complete archive. For repository routing,
  CIRAD’s GeoDE record identifies UMR TETIS (tetis.geode@cirad.fr) as custodian for the transferred
  layer. Its feature service advertises only the 2023 JECAM layer.
note: >-
  The paper’s abstract and CIRAD’s V2 records agree on 27,074 polygons. Section 3
  of the paper also gives 27,197, the count in Dataverse V1. The authors’ preprint
  cites V2. The WorldCereal documentation cites major version V2 without a patch
  number. CIRAD’s transferred V4 layer covers 2013–2022 and contains 31,879 polygons.
data:
- name: worldcereal-v2-subset
  description: >-
    WorldCereal’s JECAM-CIRAD.zip contains 18,329 polygon rows in 12 country-year
    shapefiles for 2016–2019. All 12 companion metadata workbooks cite CIRAD
    Dataverse V2. In 2016_BF_JECAM_CIRAD_POLY_111 the original fields for Id 6245
    give Koumbia, Burkina Faso, AcquiDate 2016-09-23, LandCover Cropland,
    CropType1 Cowpea and Area_ha 0.247. WorldCereal adds CT 7400 and LC 11.
    The companion curation PDF reports no geometry transformation. The first WGS84
    polygon vertex is at longitude −3.792858 and latitude 11.187465.
  media_type: application/zip
  file_size: 5825674
  checksum: md5:d1e24229728a0734532d4078c8e6f639
  locations:
  - url: https://zenodo.org/records/7593734/files/JECAM-CIRAD.zip?download=1
structures:
- name: field-polygons
  variables:
  - name: Id
    description: Identifier for the polygon in the source layer.
  - name: Country
    description: Country where the observation was made.
  - name: SiteName
    description: Survey site.
  - name: DataSource
    description: Observation method, coded 0 for field survey, 1 for image interpretation and 2 for aircraft observation.
  - name: AcquiDate
    description: Date of the survey or the image used for interpretation.
  - name: LandCover
    description: Land cover class assigned to the polygon.
  - name: CropType1
    description: Main crop.
  - name: CropType2
    description: Secondary crop in an intercrop.
  - name: CropType3
    description: Third crop in an intercrop.
  - name: SOS
    description: Local season start date, when a distinct season applies.
  - name: EOS
    description: Local season end date, when a distinct season applies.
  - name: Irrigated
    description: Irrigation code, with 0 for unknown, 1 for rainfed and 2 for irrigated. Blank outside cropland.
  - name: Intercrop
    description: Cropping pattern code, with 0 for single crop, 1 for mixed or row intercropping and 2 for agroforestry. Blank outside cropland.
  - name: Weeding
    description: Weed observation code, with 0 for unknown and 1 for weeds present. Blank outside cropland.
  - name: Area_ha
    description: Area of the digitised polygon.
    unit: ha
  - name: KeyWords
    description: Terms assigned to the polygon, separated by semicolons.
additional_links:
- rel: describedby
  title: CIRAD V2.1 metadata, historical archive filename and licence
  url: https://dataverse.cirad.fr/dataset.xhtml?persistentId=doi:10.18167/DVN1/P7OLAP&version=2.1
- rel: describedby
  title: Authors’ paper on field sampling and polygon coding
  url: https://doi.org/10.5194/essd-13-5951-2021
- rel: describedby
  title: Paper Table 1 with definitions of 16 polygon attributes and an example column
  url: https://essd.copernicus.org/articles/13/5951/2021/essd-13-5951-2021-t01.xlsx
- rel: related
  title: WorldCereal’s curated reference-data release containing the V2 subset
  url: https://doi.org/10.5281/zenodo.7593734
- rel: related
  title: CIRAD metadata for transferred V4 data
  url: https://geode.cirad.fr/geonetwork/srv/api/records/6855571d-677a-4852-afa8-7d7084ed2de8/formatters/xml
contact:
- name: Audrey Jolivot
  organization: CIRAD
  roles:
  - point-of-contact
  email: audrey.jolivot@cirad.fr
  url: https://essd.copernicus.org/articles/13/5951/2021/
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
