id: annual-global-gridded-livestock-mapping-1961-2021
title: Annual global gridded livestock density and uncertainty, 1961–2021
description: Annual modelled densities on a nominal 5-km global grid for cattle, buffaloes, sheep, goats, horses,
  pigs, chickens and ducks. The random forest workflow allocates FAOSTAT totals using suitability masks and environmental
  and human predictors. Matching annual rasters estimate uncertainty from temporal extrapolation, predictor completeness
  and environmental similarity.
