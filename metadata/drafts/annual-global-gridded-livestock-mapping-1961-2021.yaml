# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: annual-global-gridded-livestock-mapping-1961-2021
title: Annual global gridded livestock mapping from 1961 to 2021
description: First annual gridded livestock-of-the-world dataset at 5 km resolution for eight groups (cattle,
  buffaloes, sheep, goats, horses, pigs, chickens, ducks), produced by a Random Forest workflow constrained
  by FAOSTAT, with per-pixel per-year uncertainty layers. Useful for livestock distribution, food security
  and emissions analyses.
resource_type: dataset
keywords:
- food-security
- global
- high-resolution
- livestock
- machine-learning
cdh:
  domain:
  - agricultural-production
  - mitigation
created: '2026-11-13'
updated: '2026-11-13'
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
