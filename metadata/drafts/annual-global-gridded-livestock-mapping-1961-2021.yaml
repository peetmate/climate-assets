    description: Unitless relative uncertainty score from zero to one. Higher scores indicate greater uncertainty.
    unit: '1'
note: 'For one density GeoTIFF, send HTTP Range: bytes=582055744-585638275 to the v3 density ZIP URL. Require
  status 206 and the requested Content-Range, then decompress the 3,582,532 returned bytes with Python zlib.decompress(body,
  -15). The result is LivestockMap/Buffa_1963.tif (4,389,361 bytes, CRC32 1575933d). Open band 1 with a raster
  reader, use its geotransform for the coordinate and discard non-finite values. This TIFF contains NaN even though
  it declares no NoData value. Read valid land cells in heads of buffalo per square kilometre. Ignore ZIP members
  beginning with ._ (macOS metadata). Inventory review checked 2026-11-17. The ZIPs contain tiled BigTIFFs. The
  sampled map and uncertainty raster lack internal overviews. Extract and prepare overviewed COGs for hosting.
  CC BY 4.0 allows sharing and adaptation. Credit the creators, link the licence and identify changes. A reader
  retrieved data from the reviewed distribution without credentials, a form or paid access. Stored download volume
  is 17,567,143,251 bytes across 2 files. Two downloadable archives. Each ZIP lists 1,400 .tif-suffixed members,
  including macOS sidecars. Excluding __MACOSX and ._ files leaves 488 density rasters and 488 uncertainty rasters
  (976 total, eight species across 61 years). A separately named licensing rights holder remains unknown.'
