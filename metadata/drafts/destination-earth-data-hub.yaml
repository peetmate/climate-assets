# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Working draft. See register and gaps before reuse.
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: destination-earth-data-hub
title: Destination Earth Data Hub (Earth Data Hub)
description: A gateway providing pre-processed, analysis-ready Earth data optimised for cloud computing. Its
  catalogue includes the Climate Change Adaptation Digital Twin (Climate DT) at km-scale (5-10 km) resolution
  and ERA5 reanalysis collections, accessed via a personal access token.
resource_type: service
keywords:
- api
- downscaling
- era5
- global
- high-resolution
- reanalysis
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-13'
contact:
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
