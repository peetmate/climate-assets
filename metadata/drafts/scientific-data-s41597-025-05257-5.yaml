title: GROW-Africa (Groundtruthing Remote-sensing for Optimizing Yield in Africa) Database, v1.0
description: GROW-Africa is a database of 535,844 georeferenced crop-yield observations across Africa spanning
  1960-2023 (the vast majority 2000-2023). Supports analysis of historical yield trends and training of algorithms
  to estimate crop yields from Earth-observation satellite data.
