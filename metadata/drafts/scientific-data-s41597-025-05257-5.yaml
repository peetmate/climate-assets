note: Inventory review checked 2026-11-17. GROW-Africa distributes zipped workbooks and Shapefiles. Convert the
  tabular or spatial data for direct cloud access. CC BY 4.0 allows sharing and adaptation. Credit the creators,
  link the licence and identify changes. A reader retrieved data from the reviewed distribution without credentials,
  a form or paid access. Stored download volume is 287,333,412 bytes across 6 files. Published deposit, including
  any documentation and archives. Archive members are not counted separately. The data ZIP contains four workbooks
  for LSMS crop cuts, LSMS surveys, point observations and regional statistics. The readme uses .csv names for
  these tables, while the distributed ZIP contains .xlsx workbooks. Inspect workbook headers and the provider
  README to identify crop, year, location and yield units. The original sources include GADM-derived boundaries;
  their source terms should be checked before re-hosting those companion boundaries. A separately named licensing
  rights holder remains unknown.
