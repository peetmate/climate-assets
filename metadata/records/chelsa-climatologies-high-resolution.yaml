  - maintainer
  url: https://github.com/peetmate/climate-assets
version: '1.2'
doi: 10.5061/dryad.kd1d4
license: CC0-1.0
access: public
spatial:
  geography:
  - world
temporal:
  start_date: '1979'
  end_date: '2013'
note: Read band 1 of the January GeoTIFF at a land coordinate with a raster reader and honour its NoData mask. The
  cell gives the mean of the January monthly precipitation totals for 1979–2013 in millimetres. In the bucket listing,
  prec, tmean, tmax, tmin and bio name the variable folders. The V1.2 file specification and the Data Records section
  of the paper document units and temperature scaling.
data:
- name: january-precipitation
  description: January precipitation climatology over land. Each stored unit represents one millimetre of monthly
    precipitation.
  locations:
  - url: https://zhc-c.s3.cloud.switch.ch/chelsav1/climatologies/prec/CHELSA_prec_01_V1.2_land.tif
  file_size: 94582151
  media_type: image/tiff; application=geotiff
