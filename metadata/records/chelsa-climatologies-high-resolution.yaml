id: chelsa-climatologies-high-resolution
title: CHELSA V1.2 land-surface climatologies, 1979–2013
description: Monthly temperature and precipitation normals and bioclimatic variables for global land at 30 arc-second
  resolution. This release downscales ERA-Interim and includes terrain-dependent corrections. EnviDat marks V1.2
  as deprecated.
resource_type: dataset
keywords:
- climatology
- downscaling
- global
- high-resolution
- precipitation
- reanalysis
- temperature
cdh:
  domain:
  - climate
created: '2026-11-13'
updated: '2026-11-16'
contact:
- organization: CHELSA V1.2 dataset authors
  roles:
  - licensor
  - producer
  url: https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.kd1d4
- organization: Swiss Federal Institute for Forest, Snow and Landscape Research WSL
  roles:
  - point-of-contact
  name: Dirk Nikolaus Karger
  email: dirk.karger@wsl.ch
