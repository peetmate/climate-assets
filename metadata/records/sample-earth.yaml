- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
version: '1.1'
doi: 10.7910/DVN/U7HWY1
license: CC-BY-NC-4.0
access: restricted
access_note: On the Harvard Dataverse V1.1 page, choose Access File for the northern Ghana GeoPackage and then the
  original download. Dataverse requires a response to Alliance Guestbook 306 before ordinary file downloads. Its
  published form marks name, email, institution, position and the intended-use question as optional. The release
  metadata, guestbook specification and class table schema can be read anonymously. Contact Alliance Data Management
  for a commercial data-sharing agreement.
spatial:
  geography:
  - ghana
  - viet-nam
temporal:
  start_date: '2018-01-01'
  end_date: '2024-12-31'
note: Open a GeoPackage in QGIS or GDAL, select a point and read its geometry, sampling date and class identifier.
  In 01b. class_name.tab match the numeric class column to its text name. These nominal codes identify land-cover
  categories. The repository records coverage as 2018–2024 and collection as 2020–2024. Use the date on the point
  when reporting an observation. The Alliance describes its 2026 Colombia/Ghana product as a companion
  with a different legend. Its examples do not establish a point from this 2025 deposit.
