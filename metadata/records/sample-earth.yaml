id: sample-earth
title: 'Sample Earth: Machine-Learning–Ready Land-Cover Reference Dataset'
description: GPS-located land-cover reference points for the Central Highlands of Vietnam, northern Ghana and Tano-Offin,
  Ghana. This release supplies 10 main classes and 68 subclasses for training or validating land-cover maps, with
  emphasis on coffee and cocoa. Experts interpreted high-resolution imagery and used field observations for a subset
  of the Vietnam points.
resource_type: dataset
keywords:
- cocoa
- coffee
- land-cover
- machine-learning
- remote-sensing
cdh:
  domain:
  - agricultural-production
  - land
created: '2026-11-13'
updated: '2026-11-16'
