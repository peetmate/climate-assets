  description: List the producer’s Cloud Optimized GeoTIFF objects. Each has five confidence bands on its native
    10 m UTM grid.
  structures:
  - confidence
- name: confidence-example
  locations:
  - url: https://storage.googleapis.com/nature-trace/export_rasters/forest_typology_2020_v1_0/raster_4N_20_4_14.tif
  description: Native source tile raster_4N_20_4_14.tif. At 157.5544605°W, 1.8633694°N (zero-based row 3610,
    column 2398) the five raw scores are 0, 126, 0, 0, 0. Other Land scores 124. Naturally regenerating forest
    has the highest score.
  media_type: image/tiff
  file_size: 30940
  checksum: md5:c4e2a7cdaf40380a74382516bc0fef7c
