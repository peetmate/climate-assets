id: forty-global-forest-typology-10m
title: Forest Typology (ForTy) 2020 v1.0
description: Global 10 m baseline for 2020 distinguishing six forest and land-use classes aligned with Food
  and Agriculture Organization definitions. The model estimates relative class confidence from satellite embeddings.
  A companion map gives the class with the highest score.
resource_type: dataset
keywords:
- forests
- deforestation
- land-cover
- agroforestry
- tree-crops
- eudr
- remote-sensing
- machine-learning
- foundation-model
- earth-engine
- high-resolution
- global
