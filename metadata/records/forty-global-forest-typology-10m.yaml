structures:
- name: confidence
  variables:
  - name: PrimaryForest
    description: Band 1, relative confidence for primary forest. Native forest without visible indications
      of human disturbance. Divide a valid stored score (0–250) by 250.
    data_type: uint8
    unit: '1'
    nodata: 255
  - name: NaturallyRegeneratingForest
    description: Band 2, relative confidence for naturally regenerating forest. Forest established mainly by
      natural regeneration, including secondary forest. Divide a valid stored score (0–250) by 250.
    data_type: uint8
    unit: '1'
    nodata: 255
  - name: PlantedForest
    description: Band 3, relative confidence for planted forest. Forest established by planting or seeding,
      with rotation longer than 40 years. Divide a valid stored score (0–250) by 250.
    data_type: uint8
    unit: '1'
    nodata: 255
  - name: PlantationForest
    description: Band 4, relative confidence for plantation forest. Intensively managed stands of one or two
      species with regular spacing, even age and rotation of 40 years or less. Divide a valid stored score
      (0–250) by 250.
    data_type: uint8
    unit: '1'
    nodata: 255
  - name: TreeCropsAndAgroforestry
    description: Band 5, relative confidence for tree crops and agroforestry. Agricultural tree crops and mixed
      agroforestry. Divide a valid stored score (0–250) by 250.
    data_type: uint8
    unit: '1'
    nodata: 255
- name: classification
  variables:
  - name: band_1
    description: Class code for the largest of the six scores.
    data_type: uint8
    nodata: 255
    categories:
    - value: 1
      label: Primary forest
    - value: 2
      label: Naturally regenerating forest
    - value: 3
      label: Planted forest
    - value: 4
      label: Plantation forest
    - value: 5
      label: Tree crops and agroforestry
    - value: 6
      label: Other land
