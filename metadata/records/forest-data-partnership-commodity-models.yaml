# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
cdh_schema_version: v0.5.0
extensions:
- https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: forest-data-partnership-commodity-models
title: Forest Data Partnership commodity probability models (2026a)
description: Forest Data Partnership commodity model outputs for cocoa, coffee, palm and rubber at 10 m in
  the pantropics, for 2018, 2020, 2022 and 2024. Forest Persistence v0 is a separate 30 m score for undisturbed
  forest in 2020.
resource_type: dataset
keywords:
- deforestation
- forests
- cocoa
- coffee
- oil-palm
- rubber
- eudr
- commodities
- crop-mapping
- earth-engine
- remote-sensing
- high-resolution
- global
cdh:
  domain:
  - land
  - agricultural-production
created: '2026-11-13'
updated: '2026-11-16'
contact:
- organization: Google for the Forest Data Partnership
  url: https://developers.google.com/earth-engine/datasets/publisher/forestdatapartnership
  roles:
  - producer
  - licensor
- organization: Forest Data Partnership
  email: forestdatapartnership@wri.org
  url: https://goo.gle/fdap-data
  roles:
  - point-of-contact
- organization: CGIAR Climate Data Hub
  roles:
  - maintainer
  url: https://github.com/peetmate/climate-assets
version: 2026a
license: CC-BY-4.0
access: restricted
access_note: For all four years and the full 24°S–24°N commodity coverage, use a registered Earth Engine project
  or an authenticated billing project with the Google Cloud Storage Requester Pays archive. Use the release
  CSV index to select a tile by commodity, year and southwest corner. An independent Source Cooperative mirror
  provides anonymous, full-resolution tiles in West Africa for 2018 and 2024. The sampled tile matches the
  mirror’s published MD5. Checking the producer’s own checksum requires a billing project.
data:
- name: cocoa
  locations:
  - url: https://earthengine.googleapis.com/v1/projects/forestdatapartnership/assets/cocoa/model_2026a
  description: Earth Engine collection projects/forestdatapartnership/assets/cocoa/model_2026a. Select year
    and band probability (0–1).
- name: coffee
  locations:
  - url: https://earthengine.googleapis.com/v1/projects/forestdatapartnership/assets/coffee/model_2026a
  description: Earth Engine collection projects/forestdatapartnership/assets/coffee/model_2026a. Select year
    and band probability (0–1).
- name: palm
  locations:
  - url: https://earthengine.googleapis.com/v1/projects/forestdatapartnership/assets/palm/model_2026a
  description: Earth Engine collection projects/forestdatapartnership/assets/palm/model_2026a. Select year
    and band probability (0–1).
- name: rubber
  locations:
  - url: https://earthengine.googleapis.com/v1/projects/forestdatapartnership/assets/rubber/model_2026a
  description: Earth Engine collection projects/forestdatapartnership/assets/rubber/model_2026a. Select year
    and band probability (0–1).
- name: forest-persistence
  locations:
  - url: https://earthengine.googleapis.com/v1/projects/forestdatapartnership/assets/community_forests/ForestPersistence_2020
  description: Earth Engine image projects/forestdatapartnership/assets/community_forests/ForestPersistence_2020.
    Band value (0–1) measures support for undisturbed forest in 2020.
- name: commodity-tile-index
  locations:
  - url: https://storage.googleapis.com/earth-engine-public-requester-pays/forestdatapartnership/2026a/fdap_index.csv
- name: cocoa-2024-mirror-example
  locations:
  - url: https://data.source.coop/portolan-mirrors/forest-data-partnership-catalog/cocoa-2024/lng_-6_lat_4/lng_-6_lat_4.tif
  description: Independent Portolan mirror, 2024 cocoa. Read band 1 at zero-based row 0, column 0 (5.99998253°W,
    4.99997796°N). The probability of cocoa presence is 0.98333961, unitless. The STAC item identifies the
    Google source object. Its published MD5 matches the downloaded mirror file. Independent comparison with
    the source digest remains pending.
  media_type: image/tiff
  checksum: md5:a62fc3507d96706216346266407e17fe
  file_size: 81697833
