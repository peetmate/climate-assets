note: The four commodity models have a float32 probability band in [0, 1]. Each original 10 m COG covers one
  degree and uses EPSG:4326. The 2026a overview pixels represent means. Read native pixels to reproduce individual
  predictions. The separate Forest Persistence v0 image has a 30 m support score for undisturbed forest in
  2020 and its own required credit and citation.
