id: crop-suitability-major-food-crops-africa
title: Dataset of the suitability of major food crops in Africa under climate change
description: Data descriptor for a continental dataset of climate suitability for 23 major African food crops,
  generated with a calibrated EcoCrop model driven by ISIMIP3b temperature and precipitation and ISRIC soil
  data. Covers a historical baseline and mid-century projections under SSP1-RCP2.6, SSP3-RCP7.0 and SSP5-RCP8.5,
  giving both a continuous suitability index and a binary suitable/unsuitable class per crop for rainfed agriculture.
resource_type: document
